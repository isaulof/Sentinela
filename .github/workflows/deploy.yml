name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Dois trabalhos independentes:
#  - "verificar" (portão da publicação): tipos, lint, testes unitários e build. Se passar, o site é publicado.
#    Os testes unitários cobrem a lógica (datas, cálculos, mapa, exportação, banco).
#  - "e2e" (aviso): todos os testes de tela (Playwright), ao mesmo tempo. NÃO bloqueia a publicação (continue-on-error):
#    medidas de layout e mapas desenhados por software oscilam em máquina lenta. Uma falha aqui fica visível na aba Actions
#    e o relatório é guardado como artefato. Quem fizer uma mudança de tela deve olhar esse aviso.
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: test-results/
